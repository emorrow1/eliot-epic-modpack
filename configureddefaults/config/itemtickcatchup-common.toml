#Master switch. When false, dropped items behave exactly as in vanilla:
#their despawn timer pauses whenever their chunk stops ticking entities.
enabled = true
#Also wind down the pickup delay across the gap. Only matters for items
#that stopped ticking within ~2 seconds of being dropped.
catchUpPickupDelay = true
#Largest gap that will ever be applied in a single catch-up, in ticks.
#0 means unlimited, which is what you want for accurate simulation.
#Set it to e.g. 6000 if you would rather items get one full lifetime
#of grace after a long absence.
# Default: 0
# Range: 0 ~ 9223372036854775807
maxCatchUpTicks = 0
