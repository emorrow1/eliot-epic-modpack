#Wildfire Additions - server-side gameplay & balance.
#Applied per world; synced to clients where a value affects what they render.
[coating]
	#How long a retardant coating lasts, in ticks (20 ticks = 1 second).
	#Default 12000 = 10 minutes.
	# Default: 12000
	# Range: 20 ~ 1728000
	coatingLifetimeTicks = 12000
	#Fire intensity a blaze must reach to burn through a coated block.
	#PMWeather fire intensity runs 1-10. Higher = more fireproof: 10 means only the
	#very fiercest infernos ever break a coating, 1 means the coating barely helps.
	#Default 9 ('practically fireproof').
	# Default: 9
	# Range: 1 ~ 10
	coatingBreakthroughIntensity = 9

[sprayer]
	#Percent of the sprayer's full charge restored per Magma Cream when refilling
	#it in a crafting grid.
	#Default 25.
	# Default: 25
	# Range: 1 ~ 100
	sprayerRefillPercentPerMagmaCream = 25

[hose]
	#How far the fire hose can be routed from its pump box before it pulls taut and
	#slows the player, in blocks.
	#Default 50.
	# Default: 50.0
	# Range: 4.0 ~ 512.0
	maxHoseLengthBlocks = 50.0
	#Extra length past the max the hose can stretch before it snaps and is lost,
	#in blocks. Default 6.
	# Default: 6.0
	# Range: 0.0 ~ 128.0
	hoseSnapSlackBlocks = 6.0

[dousing]
	#Ticks between actual fire-intensity reductions from a water stream (hose and
	#sprinkler). Lower = fire goes out faster. Default 10 (twice a second).
	# Default: 10
	# Range: 1 ~ 200
	douseCoolPeriodTicks = 10
	#How many intensity levels a PMWeather fire loses per cooling step (of 1-10).
	#Default 3.
	# Default: 3
	# Range: 1 ~ 10
	douseIntensityStep = 3

[sprinkler]
	#Horizontal radius the fire sprinkler turret hunts for fire within, in blocks.
	#Kept inside the nozzle's ballistic reach (~27) by default so every target it
	#picks is actually hittable; raising it much past that may target fires it can't reach.
	#Default 26.
	# Default: 26
	# Range: 1 ~ 64
	sprinklerScanRangeBlocks = 26

#Drip torch backburn tuning.
[drip_torch]
	#SERVER PERFORMANCE CAP: the most drip-torch embers tracked at once per
	#dimension. Each costs a little work per tick; a wide, slow backburn can need
	#thousands. Lower this if backburns strain your server. Default 4000.
	# Default: 4000
	# Range: 1 ~ 200000
	maxTrackedEmbers = 4000
	#When there's no wildfire to burn toward, an ember clears a small diamond of
	#undergrowth this many blocks out, at minimum, before burning off. Default 3.
	# Default: 3
	# Range: 0 ~ 32
	dripTorchIdleClearRadiusMin = 3
	#...and this many blocks out at most (the actual radius is randomised in the
	#min..max range per ember). Values below the min are treated as the min.
	#Default 5.
	# Default: 5
	# Range: 0 ~ 32
	dripTorchIdleClearRadiusMax = 5

[aircraft]
	#How many intensity levels (of 1-10) an aircraft water drop knocks off each fire
	#it lands on, in one shot. Default 8.
	# Default: 8
	# Range: 1 ~ 10
	aircraftWaterKnockdown = 8
	#How long an aircraft payload run keeps trailing the plane and laying its band,
	#in ticks. Default 40 (~2 seconds).
	# Default: 40
	# Range: 1 ~ 400
	aircraftRunDurationTicks = 40
